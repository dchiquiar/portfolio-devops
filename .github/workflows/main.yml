name: Deploy Portfolio

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  APP_NAME: portfolio-devops
  
permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    name: Build Docker Image
    runs-on: ubuntu-latest
    outputs:
      image-tag: ${{ steps.tag.outputs.value }}
    steps:
      - uses: actions/checkout@v4

      - name: Generar tag
        id: tag
        run: |
          SHORT_SHA=$(echo "${{ github.sha }}" | cut -c1-7)
          echo "value=$SHORT_SHA" >> $GITHUB_OUTPUT
          echo "Tag generado: $SHORT_SHA"

      - name: Build imagen (sin push)
        uses: docker/build-push-action@v5
        with:
          context: .
          push: false
          tags: ${{ env.APP_NAME }}:${{ steps.tag.outputs.value }}
          
      - name: Generar reporte de build
        run: |
          mkdir -p reports
          echo "## Build Report" > reports/build-report.md
          echo "- App: ${{ env.APP_NAME }}" >> reports/build-report.md
          echo "- Tag: ${{ steps.tag.outputs.value }}" >> reports/build-report.md
          echo "- SHA: ${{ github.sha }}" >> reports/build-report.md
          echo "- Rama: ${{ github.ref_name }}" >> reports/build-report.md
          echo "- Actor: ${{ github.actor }}" >> reports/build-report.md
          echo "- Fecha: $(date -u)" >> reports/build-report.md

      - name: Subir reporte
        uses: actions/upload-artifact@v4
        with:
          name: build-report-${{ steps.tag.outputs.value }}
          path: reports/
          retention-days: 30
          
  scan:
    name: Security Gate (Trivy)
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4

      - name: Imprimir contexto
        run: |
          echo "SHA: ${{ github.sha }}"
          echo "Rama: ${{ github.ref_name }}"
          echo "Evento: ${{ github.event_name }}"
          echo "Actor: ${{ github.actor }}"
          echo "Runner: ${{ runner.os }}"
          echo "App: $APP_NAME"
      
      - name: Build imagen para escaneo
        uses: docker/build-push-action@v5
        with:
          context: .
          push: false
          load: true
          tags: ${{ env.APP_NAME }}:${{ needs.build.outputs.image-tag }}

      - name: Escaneo Trivy
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ env.APP_NAME }}:${{ needs.build.outputs.image-tag }}
          format: table
          exit-code: '1'
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'CRITICAL,HIGH'

  quality-gate:
    name: Quality Gate (SonarCloud)
    runs-on: ubuntu-latest
    needs: scan
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: SonarSource/sonarcloud-github-action@master
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  secrets-scan:
    name: Secrets Gate (Gitleaks)
    runs-on: ubuntu-latest
    needs: scan
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  publish:
    name: Publicar imagen (Docker Hub)
    runs-on: ubuntu-latest
    needs: [build, quality-gate, secrets-scan]
    if: github.event_name != 'pull_request'
    steps:
      - uses: actions/checkout@v4
      
      - name: Descargar reporte
        uses: actions/download-artifact@v4
        with:
          name: build-report-${{ needs.build.outputs.image-tag }}
          path: reports/

      - name: Mostrar reporte
        run: cat reports/build-report.md
        
      - name: Login a Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build y push de la imagen
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.APP_NAME }}:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.APP_NAME }}:${{ needs.build.outputs.image-tag }}

  deploy:
    name: Deploy a GitHub Pages
    runs-on: ubuntu-latest
    needs: publish
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: '.'
      - id: deployment
        uses: actions/deploy-pages@v4
